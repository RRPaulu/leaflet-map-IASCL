<div id="map" style="height:500px;"></div>

<!-- Load Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const map = L.map('map').setView([20, 0], 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Fetch GeoJSON from your Apps Script
  fetch("https://script.google.com/macros/s/AKfycby7hZbQCFJkqLHCazfArKFMqI7se0OFBcZEtYsKbkGZgIDD61tnSqaMMvDjvTPjKcgRyA/exec")
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        onEachFeature: function (feature, layer) {
          // If properties exist, show them in a popup
          if (feature.properties) {
            let popupContent = "";
            for (let key in feature.properties) {
              popupContent += `<b>${key}:</b> ${feature.properties[key]}<br>`;
            }
            layer.bindPopup(popupContent || "No properties");
          }
        }
      }).addTo(map);
    })
    .catch(err => console.error("Error loading GeoJSON:", err));
});
</script>
