<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IASCL Map</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {

  // Initialize map
  const map = L.map('map').setView([20, 0], 2);

  // Add OpenStreetMap tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Fetch GeoJSON from your Apps Script
  const geoJsonUrl = "https://script.google.com/macros/s/AKfycby7hZbQCFJkqLHCazfArKFMqI7se0OFBcZEtYsKbkGZgIDD61tnSqaMMvDjvTPjKcgRyA/exec";

  fetch(geoJsonUrl)
    .then(res => {
      if (!res.ok) throw new Error("GeoJSON fetch failed");
      return res.json();
    })
    .then(data => {
      L.geoJSON(data, {
        onEachFeature: function(feature, layer) {
          if (feature.properties) {
            let popupContent = "";
            for (let key in feature.properties) {
              popupContent += `<b>${key}:</b> ${feature.properties[key]}<br>`;
            }
            layer.bindPopup(popupContent || "No properties");
          }
        }
      }).addTo(map);
    })
    .catch(err => console.error("Error loading GeoJSON:", err));

});
</script>

</body>
</html>
